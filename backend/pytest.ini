[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
testpaths = attendance/tests core payroll/tests reimbursement/tests performance/tests tenants/tests users/tests config
norecursedirs = tests_e2e venv .git
asyncio_default_fixture_loop_scope = function
addopts = -v --maxfail=1 --durations=20 --tb=short
django_find_project = true
markers =
    e2e: marks tests as end-to-end (requires a running server)
