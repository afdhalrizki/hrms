version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./environments/.env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./environments/.env.local # Default for straight docker-compose up, overridden by --env-file
    depends_on:
      - db
      - redis
      - pgbouncer
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgbouncer:
    image: brainsam/pgbouncer:latest
    env_file:
      - ./environments/.env.local
    ports:
      - "6432:6432"
    depends_on:
      - db
    restart: unless-stopped
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./environments/.env.local
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
