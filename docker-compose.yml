services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./deploy/environments/.env.local
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    command: postgres -c listen_addresses='*'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_fresh:/var/lib/postgresql/data
      - ./backend/postgres_config/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms_user -d hrms']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  pgbouncer:
    image: brainsam/pgbouncer:latest
    env_file:
      - ./deploy/environments/.env.local
    ports:
      - '6432:6432'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    env_file:
      - ./deploy/environments/.env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./environments/.env.local
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

volumes:
  postgres_data_fresh:
