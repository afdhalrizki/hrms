version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hrms_db
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrms_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://hrms_user:hrms_password@pgbouncer:6432/hrms
      - TENANT_DOMAIN_SUFFIX=localhost
    depends_on:
      - db
      - redis
      - pgbouncer
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgbouncer:
    image: brainsam/pgbouncer:latest
    container_name: hrms_pgbouncer
    environment:
      - DB_USER=hrms_user
      - DB_PASSWORD=hrms_password
      - DB_HOST=db
      - DB_PORT=5432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      - db
    restart: unless-stopped
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_DOMAIN_SUFFIX=localhost
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
