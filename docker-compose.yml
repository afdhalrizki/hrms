services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./deploy/environments/.env.local
    environment:
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    ports:
      - '5433:5432'
    volumes:
      - postgres_data_fresh:/var/lib/postgresql/data
    container_name: hrms-db
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms_user -d hrms']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hrms_net:
        ipv4_address: 172.25.0.10
        aliases:
          - db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  pgbouncer:
    image: edoburu/pgbouncer:latest
    env_file:
      - ./deploy/environments/.env.local
    environment:
      - DATABASE_URL=postgres://hrms_user:hrms_password@172.25.0.10:5432/hrms
      - AUTH_TYPE=trust
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
    ports:
      - '6432:5432'
    restart: unless-stopped
    networks:
      hrms_net:
        ipv4_address: 172.25.0.11
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    env_file:
      - ./deploy/environments/.env.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO
    volumes:
      - ./backend:/app
    env_file:
      - ./deploy/environments/.env.local
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./environments/.env.local
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2048M

networks:
  hrms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  postgres_data_fresh:
