services:
  db:
    image: postgres:15-alpine
    env_file:
      - ../environments/.env.production_10k
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    volumes:
      - postgres_data_prod_10k:/var/lib/postgresql/data
    container_name: hrms-db-prod-10k
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hrms_net:
        ipv4_address: 172.30.0.10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-4.0}"
          memory: "${DB_MEM_LIMIT:-8G}"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory ${REDIS_MEM_LIMIT:-2G} --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "${REDIS_MEM_LIMIT:-2G}"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    env_file:
      - ../environments/.env.production_10k
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@172.30.0.10:5432/${DB_NAME}
      - AUTH_TYPE=md5
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CONN:-500}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_POOL_SIZE:-100}
    restart: unless-stopped
    networks:
      hrms_net:
        ipv4_address: 172.30.0.11
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../environments/.env.production_10k
    environment:
      - PRODUCTION=True
      - DB_HOST=pgbouncer
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-8.0}"
          memory: "${BACKEND_MEM_LIMIT:-16G}"

  celery:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO
    env_file:
      - ../environments/.env.production_10k
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "${CELERY_CPU_LIMIT:-2.0}"
          memory: "${CELERY_MEM_LIMIT:-2G}"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - ../environments/.env.production_10k
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-4.0}"
          memory: "${FRONTEND_MEM_LIMIT:-8G}"

  nginx:
    image: nginx:alpine
    container_name: hrms-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

networks:
  hrms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data_prod_10k:
  static_volume:
  media_volume:
