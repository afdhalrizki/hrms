services:
  db:
    image: postgres:15-alpine
    env_file:
      - ../environments/.env.staging_1k
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data_staging_1k:/var/lib/postgresql/data
    container_name: hrms-db-staging-1k
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hrms_net:
        ipv4_address: 172.29.0.10
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT}"
          memory: "${DB_MEM_LIMIT}"

  redis:
    image: redis:7-alpine
    container_name: hrms-redis-staging-1k
    command: redis-server --maxmemory 1G --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          memory: "${REDIS_MEM_LIMIT}"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: hrms-pgbouncer-staging-1k
    env_file:
      - ../environments/.env.staging_1k
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@172.29.0.10:5432/${DB_NAME}
      - AUTH_TYPE=md5
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CONN}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_POOL_SIZE}
    restart: unless-stopped
    networks:
      hrms_net:
        ipv4_address: 172.29.0.11
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: hrms-backend-staging-1k
    env_file:
      - ../environments/.env.staging_1k
    environment:
      - PRODUCTION=True
      - DB_HOST=pgbouncer
      - DB_PORT=5432
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT}"
          memory: "${BACKEND_MEM_LIMIT}"

  celery:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: hrms-celery-staging-1k
    command: celery -A config worker -l INFO
    env_file:
      - ../environments/.env.staging_1k
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "${CELERY_CPU_LIMIT}"
          memory: "${CELERY_MEM_LIMIT}"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: hrms-frontend-staging-1k
    env_file:
      - ../environments/.env.staging_1k
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT}"
          memory: "${FRONTEND_MEM_LIMIT}"

  nginx:
    image: nginx:alpine
    container_name: hrms-nginx-staging-1k
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - hrms_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

networks:
  hrms_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  postgres_data_staging_1k:
  static_volume:
  media_volume:
