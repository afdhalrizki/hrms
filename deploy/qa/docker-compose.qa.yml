services:
  db:
    image: postgres:15-alpine
    env_file:
      - ../environments/.env.qa
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=md5
    volumes:
      - postgres_data_qa:/var/lib/postgresql/data
    container_name: hrms-db-qa
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      hrms_qa_net:
        ipv4_address: 172.31.0.10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256M --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms_qa_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    env_file:
      - ../environments/.env.qa
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@172.31.0.10:5432/${DB_NAME}
      - AUTH_TYPE=md5
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=20
    restart: unless-stopped
    networks:
      hrms_qa_net:
        ipv4_address: 172.31.0.11
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file:
      - ../environments/.env.qa
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=5432
    volumes:
      - static_volume_qa:/app/static
      - media_volume_qa:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_qa_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  celery:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO
    env_file:
      - ../environments/.env.qa
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hrms_qa_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - ../environments/.env.qa
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - hrms_qa_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  nginx:
    image: nginx:alpine
    container_name: hrms-nginx-qa
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume_qa:/app/static:ro
      - media_volume_qa:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - hrms_qa_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - hrms_qa_net
    profiles:
      - cloudflare

networks:
  hrms_qa_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  postgres_data_qa:
  static_volume_qa:
  media_volume_qa:
