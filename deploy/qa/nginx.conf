worker_processes auto;
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types 
        text/plain 
        text/css 
        application/json 
        application/javascript 
        text/xml 
        application/xml 
        application/xml+rss 
        text/javascript 
        image/svg+xml;

    # DNS Resolver for Docker (Internal DNS)
    # This prevents 502 errors when containers are recreated with new IPs
    resolver 127.0.0.11 valid=10s;

    # Backend Upstream
    upstream backend_server {
        server backend:8000;
        keepalive 32;
    }

    # Frontend Upstream
    upstream frontend_server {
        server frontend:3000;
        keepalive 32;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name harikerja.web.id www.harikerja.web.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Suppress health check logs to prevent terminal lag
        location /api/health/ {
            access_log off;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name harikerja.web.id www.harikerja.web.id;
        client_max_body_size 100M;

        # Suppress health check logs
        location /api/health/ {
            access_log off;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSL Certificates
        ssl_certificate /etc/letsencrypt/live/harikerja.web.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/harikerja.web.id/privkey.pem;

        # SSL Optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Static Files
        location /static/ {
            alias /app/static/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # Media Files
        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, no-transform";
        }

        # API Backend
        location /api/ {
            proxy_pass http://backend_server;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            proxy_read_timeout 120s;
            proxy_connect_timeout 60s;

            # Proxy Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Admin Panel
        location /admin/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Next.js
        location / {
            set $upstream_frontend http://frontend:3000;
            proxy_pass $upstream_frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
        }
    }
}
