name: Backend Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: hrms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: hrms
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: "django-insecure-test-key-for-ci"
      DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Python dependencies
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Create environment file
        run: |
          mkdir -p deploy/environments
          cat <<EOF > deploy/environments/.env.local
          DB_NAME=hrms
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_HOST=localhost
          DB_PORT=5432
          REDIS_URL=redis://localhost:6379/1
          SECRET_KEY=django-insecure-test-key-for-ci
          DEBUG=True
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/hrms
          EOF

      - name: Run Backend Tests
        env:
          CI: "true"
          DB_PASSWORD: postgres
        run: |
          node backend/scripts/run_tests.mjs --skip-docker

      - name: Check for recurrent date-collision marker
        run: |
          echo "E2E tests currently use random dates to avoid collisions. Check update failures in CI logs if attendance already recorded errors reappear."
