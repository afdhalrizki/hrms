name: Backend Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: hrms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: hrms
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: "django-insecure-test-key-for-ci"
      DEBUG: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: backend
        run: |
          python -m pytest -q

      - name: Run E2E tests
        working-directory: backend
        run: |
          # Pastikan server backend aktif jika diperlukan (misal via docker compose)
          # Atau jika e2e sudah pakai pytest marker dan fixture yang bisa in-memory
          python -m pytest -q tests_e2e

      - name: Check for recurrent date-collision marker
        run: |
          echo "E2E tests currently use random dates to avoid collisions. Check update failures in CI logs if attendance already recorded errors reappear."
